name: inception

services:
  mariadb:
    image: mariadb:0.1
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    ports:
      - "443:443" 
    volumes:
      - wp_data:/var/www/html:ro       # serve static WP assets directly
    networks:
      - inception
    restart: unless-stopped

networks:
  inception:
    driver: bridge
    name: inception_net

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cmanuel-/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA}/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_credentials:
    file: ../secrets/credentials.txt
