name: inception

services:
  mariadb:
    image: mariadb:cg.1
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:cg.1
    container_name: wordpress
    env_file: .env
    environment:
      WP_REDIS: ${WP_REDIS:-false}
    depends_on:
      mariadb:
        condition: service_healthy
    secrets:
      - wp_credentials 
      - db_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    restart: unless-stopped

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx:cg.1
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443" 
    volumes:
      - wp_data:/var/www/html:ro  # serve static WP assets directly
    networks:
      - inception
    restart: unless-stopped

  static:
    build:
      context: ./requirements/bonus/static
      dockerfile: Dockerfile
    image: static:cg.1
    pull_policy: never
    container_name: static
    ports:
      - "8081:80"
    networks:
      - inception
    restart: unless-stopped

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer:cg.1
    pull_policy: never
    container_name: adminer
    depends_on: 
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: unless-stopped
  
  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    image: portainer:cg.1
    pull_policy: never
    container_name: portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # bind socket
      - portainer_data:/data
    networks:
      - inception
    restart: unless-stopped

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis:cg.1
    pull_policy: never
    container_name: redis
    depends_on:
      - mariadb
    env_file:
      - ./.env
    volumes:
      - redis_data:/var/lib/redis   # <-- persist AOF/RDB
    networks:
      - inception
    restart: unless-stopped

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp:cg.1
    pull_policy: never
    container_name: ftp
    env_file: .env
    depends_on:
      - wordpress
    secrets:
      - ftp_password
    volumes:
      - wp_data:/var/www/html
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    networks:
      - inception
    restart: unless-stopped

networks:
  inception:
    driver: bridge
    name: inception

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA}/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA}/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA}/portainer
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA}/redis

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

