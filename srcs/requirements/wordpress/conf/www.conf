[www]
; changed from `nobody` to `www-data`
user = www-data
group = www-data

; removed localhost to just `9000` 
listen = 9000

; added
listen.owner = www-data
listen.group = www-data

; values copied from original 
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
