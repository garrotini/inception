# run in the foreground so the container's PID 1 is the FTP daemon
background=NO
listen=YES
listen_ipv6=NO

# local users only; no anonymous
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# confine every user to its home directory (= the WordPress volume root)
chroot_local_user=YES
allow_writeable_chroot=YES

# passive mode: clients must be able to open a data connection back
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
# local test / VM-local review: the client connects to 127.0.0.1
# (change to the host LAN IP if testing from another machine)
pasv_address=127.0.0.1

use_localtime=YES
xferlog_enable=YES
secure_chroot_dir=/var/empty
pam_service_name=vsftpd
seccomp_sandbox=NO
